onboarding = false

[theme]
# Inherit the terminal's Night Owl ANSI palette from Ghostty.
name = "terminal"

[keys]
prefix = "ctrl+g"
rename_tab = ""

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "Lazygit (quit: q)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "yazi"
description = "Yazi (quit: q)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "Scratch terminal (quit: exit or Ctrl+D)"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-arrange.open"
description = "Arrange panes"

[ui]
agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true
