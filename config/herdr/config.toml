onboarding = false

[theme]
# Inherit the terminal's Night Owl ANSI palette from Ghostty.
name = "terminal"

[keys]
prefix = "ctrl+g"
rename_tab = ""
previous_workspace = 'ctrl+shift+\'
next_workspace = 'ctrl+\'
switch_tab = ["prefix+1..9", "alt+1..9"]
zoom = ["prefix+space", "ctrl+space"]
toggle_sidebar = ["prefix+b", "cmd+b"]
cycle_pane_next = ["prefix+tab", 'ctrl+cmd+\']
cycle_pane_previous = ["prefix+shift+tab", 'ctrl+shift+cmd+\']

[[keys.command]]
key = "alt+0"
type = "shell"
command = 'tab_id="$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs[9].tab_id // empty")"; [ -z "$tab_id" ] || "$HERDR_BIN_PATH" tab focus "$tab_id"'
description = "Switch to tab 10"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = 'dir="${HERDR_ACTIVE_PANE_CWD:-$PWD}"; root="$(git -C "$dir" rev-parse --show-toplevel 2>/dev/null || printf %s "$dir")"; /opt/homebrew/bin/code "$root"'
description = "Open worktree in VS Code"

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "lazygit"
description = "Lazygit (quit: q)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "yazi"
description = "Yazi (quit: q)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "Scratch terminal (quit: exit or Ctrl+D)"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-arrange.open"
description = "Arrange panes"

[ui]
agent_panel_sort = "spaces"

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true

# >>> herdr-projects key (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open"
description = "work board"
# <<< herdr-projects key

# >>> herdr-projects sidebar (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "Agent", hide = true }, { starts_with = "Reviewer #", hide = true }] }], ["agent"], [{ token = "$summary", dim = true }, "$progress"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], [{ token = "$summary", dim = true }, "$progress"]]
# <<< herdr-projects sidebar
