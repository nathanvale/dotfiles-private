_meta:
  domain: "api-explorer.xero.com"
  schema_version: 1
  discovered_at: "2026-04-07"
  last_validated_at: "2026-04-07"
  last_validated_by: "nathanvale"
  notes:
    - "Candidate scaffold translated from legacy xero-cli API Explorer recipes."
    - "No /browse live validation yet; keep all assets candidate."

canonical_assets:
  browser_state:
    state: validated
    allowed_flows:
      - healthcheck
      - ensure-api
    refs:
      - page_fingerprints.api_explorer_shell
      - pages.api_explorer_shell
    evidence: "Scaffolded from legacy xero-cli API Explorer docs on 2026-04-07. Promoted to validated by run xero-cli-api-explorer-healthcheck-2026-04-07-001 (2026-04-07): landing confirmed, API dropdown expanded/observed, Endpoint+Operation disabled-until-API-selected confirmed."
  bankstatementsplus:
    state: candidate
    allowed_flows:
      - extract-bankstatementsplus
    refs:
      - page_fingerprints.api_explorer_shell
      - pages.bankstatementsplus_form
      - pages.response_panel
    evidence: "Scaffolded from the legacy BankStatementsPlus browser recipe on 2026-04-07."
  banktransaction_post:
    state: candidate
    allowed_flows:
      - post-banktransaction
    refs:
      - page_fingerprints.api_explorer_shell
      - pages.banktransaction_post_form
      - pages.response_panel
    evidence: "Scaffolded from the legacy rapid-fire POST browser recipe on 2026-04-07."

page_fingerprints:
  api_explorer_shell:
    title_contains:
      - "API Explorer"
    required_text:
      - "Select API"
      - "Select endpoint"
      - "Select operation"
    host_contains:
      - "api-explorer.xero.com"

gotchas:
  refs_churn_after_dropdown_change:
    summary: "Snapshot refs change after every API, endpoint, or operation selection."
  fill_over_type_for_uuid_like_values:
    summary: "UUID-shaped values must use fill, not type."
  endpoint_operation_gated:
    summary: "Endpoint and operation stay disabled until API selection is complete."
  no_background_execution:
    summary: "Keep the browser work synchronous; background execution caused silent failures in legacy runs."

pages:
  api_explorer_shell:
    route:
      url: "https://api-explorer.xero.com/"
      state: validated
      validated_by: "xero-cli-api-explorer-healthcheck-2026-04-07-001"
      title: "Xero API Explorer"
    regions:
      api_dropdown:
        fields:
          trigger:
            locators:
              - strategy: text
                value: "Select API"
              - strategy: text
                value: "Xero Finance API"
              - strategy: text
                value: "Xero Accounting API"
      endpoint_dropdown:
        fields:
          trigger:
            locators:
              - strategy: text
                value: "Select endpoint"
      operation_dropdown:
        fields:
          trigger:
            locators:
              - strategy: text
                value: "Select operation"

  bankstatementsplus_form:
    route:
      url: "https://api-explorer.xero.com/"
    regions:
      parameter_form:
        fields:
          bank_account_id:
            interaction: fill
            format: uuid
            locators:
              - strategy: label_text
                value: "BankAccountID"
          from_date:
            interaction: fill
            format: "YYYY-MM-DD"
            locators:
              - strategy: label_text
                value: "FromDate"
          to_date:
            interaction: fill
            format: "YYYY-MM-DD"
            locators:
              - strategy: label_text
                value: "ToDate"
          make_request:
            interaction: click
            locators:
              - strategy: text
                value: "Make request"

  banktransaction_post_form:
    route:
      url: "https://api-explorer.xero.com/"
    regions:
      request_body:
        fields:
          body:
            interaction: fill
            format: json
            locators:
              - strategy: textarea
                value: "request-body"
              - strategy: aria_label
                value: "Request body"
          make_request:
            interaction: click
            locators:
              - strategy: text
                value: "Make request"

  response_panel:
    route:
      url: "https://api-explorer.xero.com/"
    regions:
      response:
        fields:
          copy_button:
            interaction: click
            locators:
              - strategy: aria_label
                value: "response-body-copy"
          body:
            interaction: read_only
            locators:
              - strategy: selector
                value: "pre, code, textarea[readonly]"
