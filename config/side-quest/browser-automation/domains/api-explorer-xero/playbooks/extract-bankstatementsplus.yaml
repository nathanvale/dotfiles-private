name: "extract_bankstatementsplus"
version: 1
status: "candidate"
allowed_flows:
  - "extract-bankstatementsplus"
registry:
  path: "~/.config/side-quest/browser-automation/domains/api-explorer-xero/selectors.yaml"
  schema_version: 1
page:
  fingerprint: "api_explorer_shell"
inputs:
  bank_account_id:
    required: true
    format: "uuid"
  from_date:
    required: true
    format: "YYYY-MM-DD"
  to_date:
    required: true
    format: "YYYY-MM-DD"
preflight:
  max_range_days: 366
  notes:
    - "Reject date ranges longer than 366 days before touching the browser."
execution:
  mode: "guided_browser"
  helpers:
    ensure_api_script: "~/.config/side-quest/browser-automation/domains/api-explorer-xero/scripts/ensure-api.js"
    response_script: "~/.config/side-quest/browser-automation/domains/api-explorer-xero/scripts/copy-response.js"
  steps:
    - "Ensure API dropdown is set to Finance."
    - "Select BankStatementsPlus endpoint."
    - "Select the read operation for BankStatementsPlus."
    - "Fill BankAccountID, FromDate, and ToDate using fill, never type."
    - "Click Make request and wait for the response body."
verification:
  requires:
    - "response_is_json"
    - "response_contains_statements_envelope"
guardrails:
  - "Use fill for all parameter values, especially UUID-shaped values."
  - "Take a fresh snapshot after every dropdown mutation."
  - "Keep the run synchronous and foreground."
promotion:
  notes: "Promote only after a recovery-free /browse run confirms the response envelope and file handoff end-to-end."
