name: "reconcile_clear_and_fill"
version: 1
status: "candidate"
allowed_flows:
  - "reconcile-clear-and-fill"
  - "reconcile-batch"
registry:
  path: "~/.config/side-quest/browser-automation/domains/go-xero/selectors.yaml"
  schema_version: 1
page:
  fingerprint: "bankrec"
inputs:
  line_index:
    required: true
    type: "number"
  what:
    required: true
    format: "string"
execution:
  mode: "guided_browser"
  steps:
    - "Take a fresh snapshot and locate the requested visible line by position."
    - "Clear the existing What value with fill ''."
    - "Take another fresh snapshot before re-entering the corrected What value."
    - "Use the same What-field safety rule as reconcile-fill: type+Enter for short codes, fill for UUID-shaped values."
    - "Take another fresh snapshot before clicking OK."
verification:
  requires:
    - "existing_value_cleared"
    - "corrected_value_selected"
    - "ok_click_succeeds"
guardrails:
  - "Never try to clear the field with type ''."
  - "Do not reuse refs after any DOM mutation."
  - "Keep the run synchronous and single-worker."
promotion:
  notes: "Promote only after a live /browse run confirms the corrected-value path on the real Reconcile UI."
