name: "reconcile_fill"
version: 1
status: "candidate"
allowed_flows:
  - "reconcile-fill"
  - "reconcile-batch"
registry:
  path: "~/.config/side-quest/browser-automation/domains/go-xero/selectors.yaml"
  schema_version: 1
page:
  fingerprint: "bankrec"
inputs:
  line_index:
    required: true
    type: "number"
  who:
    required: true
    format: "string"
  what:
    required: true
    format: "string"
execution:
  mode: "guided_browser"
  steps:
    - "Take a fresh snapshot and locate the requested visible line by position."
    - "Fill the Who field directly."
    - "Take another fresh snapshot before touching What."
    - "For What, prefer type+Enter for short account codes but avoid type for UUID-shaped values."
    - "Take another fresh snapshot before clicking OK."
verification:
  requires:
    - "who_value_matches"
    - "what_selection_visible"
    - "ok_click_succeeds"
guardrails:
  - "Do not reuse refs after any DOM mutation."
  - "Keep the run synchronous and single-worker."
  - "If the What field behavior is ambiguous, stop and return NEEDS_HUMAN instead of guessing."
promotion:
  notes: "Promote only after a live /browse run settles the What-field type-vs-fill tradeoff."
