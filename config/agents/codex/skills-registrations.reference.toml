# Codex Skill Exclusions: Reference Copy
#
# NOT live config. Codex never reads this file. It is a recovery copy of the
# `[[skills.config]]` blocks from `~/.codex/config.toml`, which is untracked
# because Codex rewrites it during normal use.
#
# Captured 2026-08-18. Every block below is `enabled = false`. This is an
# exclusion list, not a registration list: it records what you have turned OFF.
# A machine with no config.toml runs every skill enabled, so losing this file
# means unwanted skills return, not that skills go missing.
#
# To restore: append the blocks into `~/.codex/config.toml`, then fix paths.
#
# Two kinds of block, and they port differently.

# ---------------------------------------------------------------------------
# 1. NAME-KEYED (27 blocks). Portable. Paste unchanged.
#    Keyed by plugin-qualified skill name. No filesystem path, so these work
#    on any machine.
#
#    25 of these prune individual skills from `compound-engineering`, which is
#    kept enabled at plugin level. Disabling that plugin instead would also
#    remove the skills deliberately kept, so these do not collapse.
#
#    One entry was dropped from the captured set:
#    `agent-plugin-playground:agent-attention`. Its plugin carries
#    `[plugins."agent-plugin-playground@agent-plugin-playground"] enabled =
#    false`, so the skill-level exclusion had no effect.
# ---------------------------------------------------------------------------

