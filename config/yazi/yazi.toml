# Yazi configuration for terminal-native markdown workflow
# Ghostty + tmux + Claude Code
# Syntax: yazi v26.x (uses "url" not "name", "%s" not "$1")

[mgr]
# Sort by modified time so Claude Code's latest edits bubble to top
sort_by = "mtime"
sort_dir_first = true
sort_reverse = true
show_hidden = false
show_symlink = true

[opener]
# Open markdown - Enter opens in editor (default), Shift-O for interactive picker
markdown = [
  { run = 'open-dev-document %s', orphan = true, desc = "Open in VS Code (exact checkout)" },
  { run = 'glow -p %s', block = true, desc = "Preview with Glow" },
]

[open]
# prepend_rules merges with defaults (keeps edit, open, reveal openers)
# rules = [...] would REPLACE all defaults, breaking open --interactive
prepend_rules = [
  # Markdown files -> explicit VS Code checkout, Glow as optional preview
  { url = "*.md", use = "markdown" },
  { url = "*.markdown", use = "markdown" },
]

[plugin]
# Disable image preloaders to avoid Chafa adapter crash in tmux
# Keep previewers intact so text/code/directory previews still work
# The Chafa crash is triggered by image preloading, not text preview
# Re-enable once Ghostty 1.3+ is released and passthrough is stable
preloaders = []

# Custom video previewer: drops -skip_frame for ffmpeg 8.x compat
# audio/* must also be overridden to prevent built-in previewer using -skip_frame
prepend_previewers = [
  { mime = "video/*", run = "video-preview" },
  { mime = "audio/*", run = "video-preview" },
]
